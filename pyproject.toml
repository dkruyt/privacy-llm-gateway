[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-gateway"
version = "0.1.0"
description = "Privacy-aware OpenAI-compatible LLM gateway: classify locally, route sensitive traffic to a local model"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "h11==0.16.0",
  "click==8.5.0",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "anyio==4.15.1",
  "idna==3.20",
  "certifi==2026.10.23",
  "pydantic==2.14.1",
  "pydantic-core==2.50.1",
  "annotated-types==0.8.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "annotated-doc==0.0.5",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "prometheus-client==0.26.0",
  "detect-secrets==1.5.0",
  "requests==2.34.2",
  "urllib3==2.8.0",
  "charset-normalizer==3.5.2",
  "pypdf==6.21.2",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "pytest-cov==7.1.0",
  "coverage==7.17.0",
  "iniconfig==2.3.1",
  "pluggy==1.7.0",
  "packaging==26.3",
  "pygments==2.21.0",
]

[project.scripts]
privacy-gateway = "privacy_gateway.__main__:main"

[tool.setuptools]
packages = ["privacy_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
markers = [
  "live: runs against a real Clef server (needs CLEF_LIVE_URL)",
  "integration: docker compose integration suite",
]
addopts = "-m 'not live and not integration'"
