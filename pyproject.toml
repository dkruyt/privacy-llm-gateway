[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-llm-gateway"
version = "0.1.0"
description = "Privacy-aware OpenAI-compatible LLM gateway: classify locally, route sensitive traffic to a local model"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Dennis Kruyt"}]
keywords = ["llm", "privacy", "gateway", "openai", "proxy", "classification", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Internet :: Proxy Servers",
]
requires-python = "==3.14.*"
# Direct dependencies, pinned exactly. Transitive pins (with hashes) are in
# requirements.lock / requirements-test.lock (uv pip compile --generate-hashes).
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "prometheus-client==0.26.0",
  "detect-secrets==1.5.0",
  "pypdf==6.21.2",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "pytest-cov==7.1.0",
]

[project.urls]
Homepage = "https://github.com/dkruyt/privacy-llm-gateway"
Issues = "https://github.com/dkruyt/privacy-llm-gateway/issues"

[project.scripts]
privacy-llm-gateway = "privacy_llm_gateway.__main__:main"

[tool.setuptools]
packages = ["privacy_llm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
markers = [
  "live: runs against a real classifier server (needs CLASSIFIER_LIVE_URL)",
  "integration: docker compose integration suite",
]
addopts = "-m 'not live and not integration'"
