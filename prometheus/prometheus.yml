# Prometheus for the compose stack: scrapes the gateway's /metrics listener
# (server.metrics_listen must be 0.0.0.0:9090 inside the container).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: privacy-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9090"]
        labels: {instance: privacy-gateway}
    # If server.metrics_auth_token is set, add:
    # authorization: {credentials_file: /etc/prometheus/metrics_token}
